<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b0c">
<meta property="og:title" content="Sto lat, Byku!">
<meta property="og:description" content="Kliknij w młodego Racioka, żeby otworzyć prezent.">
<meta property="og:image" content="https://simulation1992.github.io/niespodzianka/car.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<style>
  :root{
    color-scheme:dark;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  body{margin:0;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
</style>
<title>Sto Lat Byku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
  :root{
    --ink:#0d0b0c;
    --ink-2:#161214;
    --smoke:#e8e2e0;
    --smoke-dim:#a09896;
    --red:#e01b24;
    --red-deep:#9c0f16;
    --gold:#f2c14e;
    color-scheme: dark;
  }
  html{height:100%;}
  body{min-height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% 0%, #241a1c 0%, var(--ink) 55%, #060506 100%);
    color:var(--smoke);
    font-family:"Barlow Condensed", "Helvetica Neue", Arial, sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #shell{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:safe center;
    gap:14px;
    padding-block:12px;
    padding-inline:16px;
    box-sizing:border-box;
    position:relative;
    cursor:pointer;
    user-select:none;
  }

  .eyebrow{
    font-family:"Barlow Condensed",sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.28em;
    font-size:.72rem;
    color:var(--smoke-dim);
    text-align:center;
    margin:0;
  }

  #stage{
    position:relative;
    flex:0 1 auto;
    display:grid;
    place-items:center;
    max-width:100%;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,.65));
  }
  #stage img{
    grid-area:1/1;
    max-width:100%;
    max-height:min(70vh, 720px);
    width:auto;
    height:auto;
    border-radius:10px;
    display:block;
    transition:opacity .55s ease, transform .55s cubic-bezier(.2,.9,.25,1.2);
    will-change:opacity,transform;
  }
  #shot-car{opacity:1;transform:scale(1);}
  #shot-shirt{opacity:0;transform:scale(.82) rotate(-3deg);}
  body.revealed #shot-car{opacity:0;transform:scale(1.08);}
  body.revealed #shot-shirt{opacity:1;transform:scale(1) rotate(0deg);}

  /* pulsujaca ramka-zacheta */
  #ring{
    grid-area:1/1;
    position:absolute;
    inset:-10px;
    border:2px solid var(--red);
    border-radius:14px;
    opacity:.0;
    animation:pulse 2.1s ease-in-out infinite;
    pointer-events:none;
  }
  body.revealed #ring{animation:none;opacity:0;}
  @keyframes pulse{
    0%,100%{opacity:.15;transform:scale(1);}
    50%{opacity:.55;transform:scale(1.012);}
  }

  #hint{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:.95rem;
    color:var(--smoke);
    text-align:center;
  }
  #hint .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--red);
    box-shadow:0 0 0 0 rgba(224,27,36,.6);
    animation:beat 1.6s ease-out infinite;
  }
  @keyframes beat{
    0%{box-shadow:0 0 0 0 rgba(224,27,36,.55);}
    70%{box-shadow:0 0 0 14px rgba(224,27,36,0);}
    100%{box-shadow:0 0 0 0 rgba(224,27,36,0);}
  }

  #headline{
    font-family:"Anton","Arial Black",sans-serif;
    font-size:clamp(2rem, 11vw, 4.2rem);
    line-height:.92;
    letter-spacing:.01em;
    text-transform:uppercase;
    text-align:center;
    margin:0;
    color:#fff;
    text-wrap:balance;
    opacity:0;
    transform:translateY(14px) scale(.96);
    transition:opacity .5s ease .25s, transform .5s cubic-bezier(.2,.9,.25,1.3) .25s;
  }
  #headline span{color:var(--red);display:block;}
  body.revealed #headline{opacity:1;transform:none;}

  #signed{
    max-width:32ch;
    margin:0;
    text-align:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease .55s, transform .5s ease .55s;
  }
  #signed .from{
    display:block;
    font-size:.68rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:8px;
  }
  #signed .names{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:baseline;
    column-gap:.5em;
    row-gap:4px;
    font-weight:700;
    font-size:clamp(.95rem, 4.2vw, 1.15rem);
    letter-spacing:.06em;
    color:var(--smoke);
  }
  #signed .n{white-space:nowrap;}
  #signed .n:not(:last-child)::after{
    content:"•";
    margin-left:.5em;
    color:var(--red);
    font-weight:500;
    opacity:.75;
  }
  body.revealed #signed{opacity:1;transform:none;}

  #fineprint{
    max-width:36ch;
    margin:0;
    text-align:center;
    font-size:.72rem;
    line-height:1.5;
    letter-spacing:.04em;
    color:var(--smoke-dim);
    text-wrap:balance;
    opacity:0;
    transition:opacity .5s ease .75s;
  }
  #fineprint strong{color:var(--smoke);font-weight:700;}
  body.revealed #fineprint{opacity:.9;}
  #again{
    appearance:none;
    border:1.5px solid rgba(232,226,224,.35);
    background:transparent;
    color:var(--smoke);
    font-family:"Barlow Condensed",sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.16em;
    font-size:.8rem;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease .6s, border-color .2s, color .2s;
  }
  #again:hover{border-color:var(--red);color:#fff;}
  #again:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  body.revealed #again{opacity:1;pointer-events:auto;}

  #confetti{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:40;
  }
  #balloons{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:30;
  }
  .balloon{
    position:absolute;
    bottom:-24vh;
    width:56px;
    height:70px;
    border-radius:50% 50% 48% 48%;
    will-change:transform;
  }
  .balloon::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    width:1px;
    height:70px;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0));
  }
  @media (prefers-reduced-motion: reduce){
    #ring,#hint .dot{animation:none;}
    #stage img{transition-duration:.01ms;}
    .balloon{display:none;}
  }
</style>
</head>
<body>

<div id="shell">
  <p class="eyebrow">Urodzinowa niespodzianka</p>

  <div id="stage">
    <img id="shot-car" src="car.jpg" alt="Prezent urodzinowy — niespodzianka">
    <img id="shot-shirt" src="shirt.jpg" alt="Koszulka meczowa Janža 64 — do odbioru 26.10.2026">
    <div id="ring"></div>
  </div>

  <div id="hint"><span class="dot"></span><span id="hint-text">Kliknij w młodego Racioka, żeby otworzyć prezent</span></div>

  <h1 id="headline">Sto lat<span>Byku!</span></h1>

  <p id="signed"><span class="from">Od</span><span class="names"><span class="n">Andrzej</span><span class="n">Gusia</span><span class="n">Domi</span><span class="n">Kamil</span><span class="n">Maja</span><span class="n">Kazik</span><span class="n">Grzesiek</span><span class="n">Ania</span><span class="n">Hania</span><span class="n">Kondziu</span><span class="n">Adam</span></span></p>

  <button id="again" type="button">Zapakuj z powrotem</button>

  <p id="fineprint">Koszulka w preorderze — do odbioru <strong>26.10.2026</strong> w sklepie Górnika na stadionie.</p>
</div>

<div id="balloons"></div>
<canvas id="confetti"></canvas>

<script>
(function(){
  var body = document.body;
  var shell = document.getElementById('shell');
  var again = document.getElementById('again');
  var hintText = document.getElementById('hint-text');
  var balloonLayer = document.getElementById('balloons');
  var canvas = document.getElementById('confetti');
  var ctx = canvas.getContext('2d');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- confetti ---------- */
  var COLORS = ['#e01b24','#ffffff','#f2c14e','#9c0f16','#e8e2e0','#111111'];
  var pieces = [];
  var raf = null;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function sizeCanvas(){
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  function burst(count){
    var w = window.innerWidth, h = window.innerHeight;
    for(var i=0;i<count;i++){
      var fromLeft = i % 2 === 0;
      pieces.push({
        x: fromLeft ? -10 : w + 10,
        y: h * (0.55 + Math.random()*0.35),
        vx: (fromLeft ? 1 : -1) * (7 + Math.random()*9),
        vy: -(7 + Math.random()*11),
        g: 0.24 + Math.random()*0.12,
        w: 6 + Math.random()*7,
        h: 9 + Math.random()*10,
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.34,
        color: COLORS[(Math.random()*COLORS.length)|0],
        life: 0
      });
    }
    // dodatkowy wystrzal z gory-srodka
    for(var j=0;j<count/2;j++){
      pieces.push({
        x: w/2 + (Math.random()-0.5)*w*0.5,
        y: -20 - Math.random()*80,
        vx: (Math.random()-0.5)*4,
        vy: 2 + Math.random()*3,
        g: 0.16 + Math.random()*0.08,
        w: 6 + Math.random()*6,
        h: 8 + Math.random()*9,
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        color: COLORS[(Math.random()*COLORS.length)|0],
        life: 0
      });
    }
    if(!raf) raf = requestAnimationFrame(tick);
  }

  function tick(){
    var w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0,0,w,h);
    for(var i=pieces.length-1;i>=0;i--){
      var p = pieces[i];
      p.vy += p.g;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life++;
      if(p.y > h + 60 || p.life > 700){ pieces.splice(i,1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life > 480 ? Math.max(0, 1 - (p.life-480)/220) : 1;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h * (0.55 + 0.45*Math.abs(Math.cos(p.rot))));
      ctx.restore();
    }
    if(pieces.length){ raf = requestAnimationFrame(tick); }
    else { ctx.clearRect(0,0,w,h); raf = null; }
  }

  /* ---------- balony ---------- */
  var BALLOON_COLORS = [
    ['#ff4b52','#c1131a'],
    ['#ffffff','#c9c2c0'],
    ['#2a2426','#000000'],
    ['#f2c14e','#c48f16']
  ];
  function balloons(n){
    if(reduced) return;
    for(var i=0;i<n;i++){
      (function(i){
        setTimeout(function(){
          var b = document.createElement('div');
          b.className = 'balloon';
          var c = BALLOON_COLORS[(Math.random()*BALLOON_COLORS.length)|0];
          var scale = 0.7 + Math.random()*0.8;
          var drift = (Math.random()-0.5)*90;
          var dur = 4200 + Math.random()*2600;
          b.style.left = (Math.random()*92) + 'vw';
          b.style.background = 'radial-gradient(circle at 32% 28%, ' + c[0] + ', ' + c[1] + ' 72%)';
          b.style.transform = 'scale(' + scale.toFixed(2) + ')';
          balloonLayer.appendChild(b);
          var anim = b.animate([
            { transform: 'translate3d(0,0,0) scale(' + scale + ') rotate(0deg)', opacity: 1 },
            { transform: 'translate3d(' + drift + 'px,-135vh,0) scale(' + scale + ') rotate(' + (drift/6) + 'deg)', opacity: .9 }
          ], { duration: dur, easing: 'cubic-bezier(.35,.1,.5,1)' });
          anim.onfinish = function(){ b.remove(); };
        }, i * 110);
      })(i);
    }
  }

  /* ---------- fanfary (Web Audio, bez plikow) ---------- */
  var actx = null;
  function audio(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }

  function horn(freq, start, dur, gainPeak){
    var a = actx;
    var osc = a.createOscillator();
    var osc2 = a.createOscillator();
    var g = a.createGain();
    var filt = a.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(2600, start);
    osc.type = 'sawtooth';
    osc2.type = 'square';
    osc.frequency.setValueAtTime(freq, start);
    osc2.frequency.setValueAtTime(freq, start);
    osc2.detune.setValueAtTime(7, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gainPeak, start + 0.035);
    g.gain.exponentialRampToValueAtTime(gainPeak * 0.55, start + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(filt); osc2.connect(filt); filt.connect(g); g.connect(a.destination);
    osc.start(start); osc2.start(start);
    osc.stop(start + dur + 0.05); osc2.stop(start + dur + 0.05);
  }

  function sparkle(start){
    var a = actx;
    var len = Math.floor(a.sampleRate * 0.9);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.4); }
    var src = a.createBufferSource();
    src.buffer = buf;
    var hp = a.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 3200;
    var g = a.createGain();
    g.gain.setValueAtTime(0.16, start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
    src.connect(hp); hp.connect(g); g.connect(a.destination);
    src.start(start);
  }

  function fanfare(){
    var a = audio();
    if(!a) return;
    var t = a.currentTime + 0.04;
    // G4 - C5 - E5 - G5 - C6, klasyczna fanfara
    horn(392.00, t,        0.16, 0.16);
    horn(523.25, t + 0.15, 0.16, 0.17);
    horn(659.25, t + 0.30, 0.16, 0.17);
    horn(783.99, t + 0.45, 0.34, 0.19);
    horn(1046.50, t + 0.80, 0.85, 0.20);
    horn(783.99, t + 0.80, 0.85, 0.11);
    horn(659.25, t + 0.80, 0.85, 0.09);
    sparkle(t + 0.78);
  }

  /* ---------- sterowanie ---------- */
  var revealed = false;

  function celebrate(){
    fanfare();
    burst(reduced ? 40 : 90);
    balloons(reduced ? 0 : 14);
  }

  function reveal(){
    revealed = true;
    body.classList.add('revealed');
    hintText.textContent = 'Kliknij jeszcze raz — poleci więcej';
    celebrate();
  }

  function reset(){
    revealed = false;
    body.classList.remove('revealed');
    hintText.textContent = 'Kliknij w młodego Racioka, żeby otworzyć prezent';
  }

  shell.addEventListener('click', function(e){
    if(e.target === again) return;
    if(!revealed) reveal();
    else celebrate();
  });

  shell.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if(!revealed) reveal(); else celebrate();
    }
  });
  shell.tabIndex = 0;

  again.addEventListener('click', function(e){
    e.stopPropagation();
    reset();
  });
})();
</script>
</body>
</html>
